name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check memtrust tests examples
      - name: Ruff (format check)
        run: ruff format --check memtrust tests examples
      - name: mypy
        run: mypy memtrust

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + dev only, no provider SDKs)
        run: uv pip install --system -e ".[dev]"
      - name: Run tests
        run: pytest -ra
      - name: Run examples (smoke)
        run: |
          for f in examples/*.py; do
            echo "=== $f ==="
            python "$f"
          done

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: uv build
      - name: Check clean-env import
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          /tmp/clean/bin/python -c "import memtrust; print(memtrust.__version__)"
